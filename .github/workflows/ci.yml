name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  # Fast feedback: formatting, vet, unit tests. No Docker needed.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | tee /dev/stderr)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files, run 'make fmt'"
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint (staticcheck, errcheck, govet, revive, gosec)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          make lint

      - name: Unit tests
        run: make test-race

      - name: Coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Build
        run: make build

      # The image is "FROM scratch": a dynamically linked binary would not start.
      - name: Verify the binary is static
        run: |
          file bin/docker-hoster-injector
          file bin/docker-hoster-injector | grep -q 'statically linked'
          ! ldd bin/docker-hoster-injector

  # The whole point of the project: does the host actually resolve the name?
  # It runs against the Docker engine of the runner, as root, because the suite
  # rewrites /etc/hosts (backed up and restored). Older engines cannot share the
  # runner's network namespace safely, so compatibility with older API versions
  # is checked by the API-pinned test in the suite instead
  # (test/integration/apiversion_test.go).
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Report the engine under test
        run: |
          docker version
          echo "API version: $(docker version --format '{{.Server.APIVersion}}')"

      # Root is needed to rewrite /etc/hosts; -E keeps the environment.
      - name: Integration tests
        run: |
          set +e
          make test-integration SUDO="sudo -E" 2>&1 | tee integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=integration failed::$(grep -E '^(---|    ---|FAIL|panic|\s+[a-z_]+_test.go:)' integration.log | grep -v PASS | tail -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"

  # The web UI in a real browser, against a real agent and real containers.
  e2e:
    name: web UI (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Browser tests
        run: |
          set +e
          make test-e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=e2e failed::$(tail -n 60 e2e.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test/e2e/test-results

  # What a user actually runs: the shipped docker-compose.yml, a real container,
  # a real name resolution, and the hosts file given back on "compose down".
  smoke:
    name: smoke (docker-compose.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: make smoke

  image:
    name: image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect
        run: |
          docker build -t docker-hoster-injector:ci .
          docker image inspect docker-hoster-injector:ci \
            --format 'size={{.Size}} bytes, entrypoint={{.Config.Entrypoint}}'

  # Publishes the image to GitHub Container Registry, only from main and from
  # version tags, and only when everything else is green.
  publish:
    name: publish image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [lint, integration, e2e, smoke, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
