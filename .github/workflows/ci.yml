name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  # Fast feedback: formatting, vet, unit tests. No Docker needed.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | tee /dev/stderr)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files, run 'make fmt'"
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint (staticcheck, errcheck, govet, revive, gosec)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          make lint

      - name: Unit tests
        run: make test-race

      - name: Coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Build
        run: make build

      # The image is "FROM scratch": a dynamically linked binary would not start.
      - name: Verify the binary is static
        run: |
          file bin/docker-hoster-injector
          file bin/docker-hoster-injector | grep -q 'statically linked'
          ! ldd bin/docker-hoster-injector

  # The whole point of the project: does the host actually resolve the name?
  # Runs against real Docker engines. The supported floor is API 1.40 (Docker
  # 19.03); 20.10 and 23 are the oldest engines available as dind images, and
  # are marked experimental until they have a record of passing: a failure there
  # is reported but does not fail the workflow.
  integration:
    name: integration (docker ${{ matrix.docker }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        docker: ['25', '26', '27', '28', '29']
        experimental: [false]
        include:
          - docker: '20.10'
            experimental: true
          - docker: '23'
            experimental: true
    services:
      docker:
        image: docker:${{ matrix.docker }}-dind
        options: >-
          --privileged
          --name docker-dind-${{ matrix.docker }}
          --network host
          --dns 8.8.8.8
          --env DOCKER_TLS_CERTDIR=
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: tcp://localhost:2375
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Wait for the Docker daemon
        run: |
          for i in $(seq 1 60); do
            if docker version; then
              echo "daemon is up"
              exit 0
            fi
            echo "waiting for docker ($i/60)"
            sleep 2
          done
          echo "::error::Docker daemon never became ready"
          exit 1

      - name: Report the engine version under test
        run: |
          docker version
          echo "API version: $(docker version --format '{{.Server.APIVersion}}')"

      # Root is needed to rewrite /etc/hosts; -E keeps DOCKER_HOST.
      - name: Integration tests
        run: make test-integration SUDO="sudo -E"

      - name: Build the image
        run: docker build -t docker-hoster-injector:ci .

  # The web UI in a real browser, against a real agent and real containers.
  e2e:
    name: web UI (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Browser tests
        run: make test-e2e

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test/e2e/test-results

  # What a user actually runs: the shipped docker-compose.yml, a real container,
  # a real name resolution, and the hosts file given back on "compose down".
  smoke:
    name: smoke (docker-compose.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: make smoke

  image:
    name: image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect
        run: |
          docker build -t docker-hoster-injector:ci .
          docker image inspect docker-hoster-injector:ci \
            --format 'size={{.Size}} bytes, entrypoint={{.Config.Entrypoint}}'

  # Publishes the image to GitHub Container Registry, only from main and from
  # version tags, and only when everything else is green.
  publish:
    name: publish image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [lint, integration, e2e, smoke, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
