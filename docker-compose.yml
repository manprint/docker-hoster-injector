# Copy this file to docker-compose.yml and adjust as needed.
#
# The agent needs exactly two things from the host: the Docker socket, to
# observe the container lifecycle, and the hosts file, to write into it.
services:
  docker-hoster-injector:
    image: docker-hoster-injector:dev
    build: .
    container_name: docker-hoster-injector
    restart: unless-stopped

    # On "docker stop" the agent removes its records from the hosts file and
    # gives up after 8 seconds, so Docker's default 10 second grace period is
    # enough. Do not set it lower than that.
    stop_grace_period: 10s

    environment:
      # The base domain. A container named "nginx" becomes nginx.docker.local.
      DNS_SUFFIX: docker.local

      # The hosts file is reached through the directory mount below. In this
      # mode the agent writes a temporary file next to it and renames it over
      # the original, so the update is atomic and survives anything on the host
      # that replaces /etc/hosts with a rename (the inode changes, the directory
      # does not). A single-file bind mount would keep writing to the old inode.
      HOSTS_FILE: /host/etc/hosts
      HOSTS_MOUNT_MODE: dir

      # Optional tuning, shown with their defaults.
      # TARGET_MODE: both          # both | published | container-ip
      # RESYNC_INTERVAL: 30s       # full reconciliation period
      # EVENT_DEBOUNCE: 250ms      # coalesce bursts of docker events
      # LOG_LEVEL: info
      # LOG_FORMAT: json
      # WEB_ADDR: ":8080"

    volumes:
      # The agent only reads, so :ro is the honest declaration. It does not
      # restrict what can be asked through the socket, though: treat access to
      # it as root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # The directory of the hosts file, writable: the atomic update needs to
      # create a file next to /etc/hosts. The agent touches nothing else in it.
      # Prefer this over mounting the single file (-v /etc/hosts:/etc/hosts
      # with the default HOSTS_MOUNT_MODE=file), which stops working if the file
      # is ever replaced on the host.
      - /etc:/host/etc

    ports:
      # The read-only monitoring table. Bound to loopback because the API has
      # no authentication: it reveals container names, addresses and ports.
      - "127.0.0.1:8080:8080"

    # The agent only writes the hosts file, so it needs no extra privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
